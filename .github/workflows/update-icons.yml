name: Regenerate application icons
on:
  push:
    branches: [main]
    paths:
      - public/favicon.svg
      - scripts/build-icons.py
      - .github/workflows/update-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install cairosvg
      - run: python scripts/build-icons.py
      - name: Commit updated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icon-192.png public/icon-512.png public/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: update PWA icons to professional graphite palette"
            git push origin HEAD:main
          fi
